name: Sync Analytics Data

on:
  schedule:
    # Run every Monday at midnight UTC (weekly)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual triggering

env:
  NETLIFY_URL: https://remarkable-syrniki-5c721e.netlify.app

jobs:
  sync-analytics:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push changes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch and aggregate visit data
        run: |
          python3 << 'EOF'
          import json
          import os
          import sys
          import urllib.request
          from collections import defaultdict
          from datetime import datetime, timezone

          url = f"{os.environ['NETLIFY_URL']}/.netlify/functions/export-visits"
          print(f"Fetching data from: {url}")

          # Any failure must stop the job. Writing an empty result here would
          # publish a zeroed dashboard over good data on the next step.
          with urllib.request.urlopen(url, timeout=60) as response:
              export_data = json.loads(response.read().decode())

          visits = export_data.get('visits', [])
          # All-time count from the database, not len(visits) — the export
          # returns a bounded window, so counting rows here would freeze the
          # running total at the window size.
          total_visits = export_data.get('total')

          print(f"Fetched {len(visits)} visits (all-time total: {total_visits})")

          if not visits:
              sys.exit('Export returned zero visits; refusing to overwrite published data.')

          if total_visits is None:
              sys.exit('Export omitted the all-time total; refusing to publish a partial count.')

          # Single pass: country, region and daily timeline.
          country_counts = defaultdict(int)
          region_counts = defaultdict(int)
          timeline_counts = defaultdict(int)

          for visit in visits:
              country = visit.get('country')
              region = visit.get('region')
              timestamp = visit.get('timestamp', '')

              country_counts[country or 'Unknown'] += 1
              if country and region:
                  region_counts[f"{region}, {country}"] += 1
              if timestamp:
                  timeline_counts[timestamp.split('T')[0]] += 1

          stats = {
              # All-time, across the whole table.
              "totalVisits": total_visits,
              # Everything below covers the published window only.
              "visitsAnalyzed": len(visits),
              "visitsByCountry": dict(country_counts),
              "visitsByRegion": dict(region_counts),
              "timeline": [{"date": d, "count": c} for d, c in sorted(timeline_counts.items())],
              # Raw rows are kept deliberately: the dashboard's exploration
              # views (timeline slider, country breakdown) read from them.
              "visits": visits,
              "lastUpdated": datetime.now(timezone.utc).isoformat()
          }

          os.makedirs('assets/data', exist_ok=True)
          with open('assets/data/analytics-stats.json', 'w') as f:
              json.dump(stats, f, indent=2)

          print(f"All-time visits: {stats['totalVisits']}")
          print(f"Analyzed window: {stats['visitsAnalyzed']}")
          print(f"Countries: {len(stats['visitsByCountry'])}")
          print(f"Regions: {len(stats['visitsByRegion'])}")
          EOF

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add assets/data/analytics-stats.json
          if ! git diff --staged --quiet; then
            git commit -m "Update analytics data [skip ci]"
            git push
          else
            echo "No changes to commit"
          fi
