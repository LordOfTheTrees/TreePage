name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The site must build. This is the check that catches Liquid errors, bad
  # front matter, missing includes, and non-ASCII in _sass (Sass 3.7 rejects it).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter

  # Functions and browser scripts must lint, and the function tests must pass.
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
