<header class="site-header">
  <div class="wrap">
    {% if page.full_bleed %}
    <a class="wordmark" href="#top">Andrew Erbs</a>
    {% else %}
    <a class="wordmark" href="{{ '/' | relative_url }}">Andrew Erbs</a>
    {% endif %}
    <button type="button" class="menu-toggle" aria-expanded="false" aria-controls="site-nav">Menu</button>
    <nav id="site-nav" class="site-nav" aria-label="Primary">
      {% if page.full_bleed %}
      <a href="#work">Work</a>
      <a href="#writing">Writing</a>
      <a href="#about">About</a>
      {% else %}
      <a href="{{ '/#work' | relative_url }}">Work</a>
      <a href="{{ '/pages/posts/' | relative_url }}">Writing</a>
      <a href="{{ '/pages/about/' | relative_url }}">About</a>
      <a href="{{ '/pages/contact/' | relative_url }}">Contact</a>
      {% endif %}
      <a class="hide-sm" href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a class="hide-sm" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a>
    </nav>
  </div>
</header>
