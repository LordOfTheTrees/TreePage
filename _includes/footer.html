<footer class="site-footer">
  <div class="wrap">
    <p>&copy; {{ site.time | date: '%Y' }} Andrew Erbs</p>
    <nav aria-label="Footer">
      <a href="https://linkedin.com/in/{{ site.linkedin_username }}" target="_blank" rel="noopener noreferrer">LinkedIn</a>
      <a href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="{{ '/pages/posts/' | relative_url }}">Writing</a>
      <a href="{{ '/pages/photography/' | relative_url }}">Photography</a>

  </div>
</footer>

<!-- Add analytics scripts -->
{% if site.netlify_functions_url %}
<script>
  // Make Netlify Functions URL available to analytics.js
  window.NETLIFY_FUNCTIONS_URL = '{{ site.netlify_functions_url }}';
</script>
{% endif %}
<script src="{{ site.baseurl }}/assets/js/analytics.js"></script>
<script src="{{ site.baseurl }}/assets/js/analytics-display.js"></script>
