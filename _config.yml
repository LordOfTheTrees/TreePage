# Site settings
title: Andrew Erbs
description: >
  Andrew Erbs, Director of AI Solutions at GO Media. Writing and projects on
  product, data, and applied AI.
author: Andrew Erbs
logo: /assets/images/profile.jpg
baseurl: "/TreePage" # the subpath of your site, e.g. /blog
url: "https://lordofthetrees.github.io" # Replace with your GitHub username
github_username: lordofthetrees
linkedin_username: andrew-erbs-59bb9365

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile.jpg
  # Static HTML (no front matter) is still listed by jekyll-sitemap. This
  # keeps the Search Console verification file out of sitemap.xml.
  - scope:
      path: "googlefdb247ce0b7de941.html"
    values:
      sitemap: false

# Analytics settings
netlify_functions_url: "https://remarkable-syrniki-5c721e.netlify.app" # Your Netlify site URL for Functions

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  projects:
    output: true
    permalink: ./projects/:path/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .gitignore
  - README.md