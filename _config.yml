# Site settings
title: Andrew Erbs
description: "Andrew Erbs, Director of AI Solutions at GO Media. Work and writing on product, data, and applied AI, from Navy systems and Yale research to the tools he ships."
author: Andrew Erbs
logo: /assets/images/profile.jpg
# Domain root. The repo is lordofthetrees.github.io, so the site is not under /TreePage/.
baseurl: ""
url: "https://lordofthetrees.github.io"
github_username: lordofthetrees
linkedin_username: andrew-erbs-59bb9365

# Posts only. Pages keep the permalink in their own front matter.
# :title keeps the filename slug (case and underscores), with no category segment.
permalink: /posts/:title/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/profile.jpg
  # Static HTML (no front matter) is still listed by jekyll-sitemap. This
  # keeps the Search Console verification file out of sitemap.xml.
  - scope:
      path: "googlefdb247ce0b7de941.html"
    values:
      sitemap: false

# Analytics settings
netlify_functions_url: "https://remarkable-syrniki-5c721e.netlify.app" # Your Netlify site URL for Functions

# Build settings
markdown: kramdown
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Redirect pages are generated from front matter. Skip the extra redirects.json,
# which is not site content and would otherwise be written into the sitemap set.
redirect_from:
  json: false

# Collections
collections:
  projects:
    output: true
    permalink: ./projects/:path/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - supabase
  - .gitignore
  - README.md
  - tests